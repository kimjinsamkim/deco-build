<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>decorate your building</title>
    <style>
        .sticker {
            width: 80px;
            height: 80px;
            background-color: skyblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #signage-grid {
            display: flex;
            gap: 12px;
        }
        #cart {
            min-height: 100px;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px
        }
        #checkout-btn {
            margin-left: 16px;
        }

    </style>
</head>


<body>
    <h1>select signs</h1>
    <div id="signage-grid">
         <div class="sticker" draggable="true">A</div>
        <div class="sticker" draggable="true">B</div>
        <div class="sticker" draggable="true">C</div>
    </div>

    <h2>cart <button id="checkout-btn">check out</button></h2>
    <div id="cart"></div>

    <script>
        const stickers = document.querySelectorAll('.sticker');
        const cart = document.getElementById('cart');

        stickers.forEach(sticker => {
            sticker.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', sticker.outerHTML);
            });
        });

        cart.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        cart.addEventListener('drop', (e) => {
            e.preventDefault();
            const html = e.dataTransfer.getData('text/plain');
            cart.insertAdjacentHTML('beforeend',html);
        });
    </script>


</body>
</html>
