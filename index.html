<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>decorate your building</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .sticker {
            width: 80px;
            height: 80px;
            background-color: skyblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #signage-grid {
            display: flex;
            gap: 12px;
        }
        #cart {
            min-height: 100px;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px
        }
        #checkout-btn {
            margin-left: 16px;
        }
        #checkout-view {
            display: none;
        }
        #checkout-list {
            min-height: 100px;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 12px
        }
        .checkout-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        #checkout-footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #decorate-view {
            display: none;
        }
        #building-canvas {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #ddd;
            border: 1px solid #999;
        }
        #sticker-tray {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding: 12px;
            border: 2px dashed #999;
            border-radius: 8px;
            min-height: 100px
        }

    </style>
</head>


<body>
    <div id="main-view">
        <h1>select signs</h1>
        <div id="signage-grid">
            <div class="sticker" draggable="true" data-desc="apple">A</div>
            <div class="sticker" draggable="true" data-desc="banana">B</div>
            <div class="sticker" draggable="true" data-desc="cherry">C</div>
        </div>

        <h2>cart <button id="checkout-btn">check out</button></h2>
        <div id="cart"></div>
    </div>

    <div id="checkout-view">
        <h1>your cart</h1>
        <div id="checkout-list"></div>
        <div id="checkout-footer">
            <span id="item-count"></span>
            <button id="back-btn">back</button>
            <button id="proceed-btn">proceed</button>
        </div>
    </div>

    <div id = "decorate-view">
        <h1>decorate your building</h1>
        <div id="building-canvas"></div>
        <button id="reset-btn">reset</button>
        <button id="back-to-shop-btn">back to shop</button>
        <div id="sticker-tray"></div>
    </div>

    <script>
        const stickers = document.querySelectorAll('.sticker');
        const cart = document.getElementById('cart');

        let draggedItem = null;

        stickers.forEach(sticker => {
            sticker.addEventListener('dragstart', (e) => {
                draggedItem = sticker;
            });
        });

        cart.addEventListener('dragover', (e)=> {
            e.preventDefault();
        });

        cart.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedItem) {
                cart.appendChild(draggedItem);
                draggedItem = null;
            }
        });

        const mainView = document.getElementById('main-view');
        const checkoutView = document.getElementById('checkout-view');
        const checkoutList = document.getElementById('checkout-list');
        const itemCount = document.getElementById('item-count');
        const checkoutBtn = document.getElementById('checkout-btn');
        const backBtn = document.getElementById('back-btn');

        checkoutBtn.addEventListener('click', () => {
            const cartItems = Array.from(cart.children);
            cartItems.sort((a,b) => a.textContent.localeCompare(b.textContent));

            checkoutList.innerHTML = '';
            cartItems.forEach(item => {
                const row = document.createElement('div');
                row.className = 'checkout-item';
                row.innerHTML = `
                <div class="sticker">${item.textContent}</div>
                <span>${item.dataset.desc}</span>
                `;
                checkoutList.appendChild(row);
            });

            itemCount.textContent = `you selected ${cartItems.length} items`;

        mainView.style.display = 'none';
        checkoutView.style.display = 'block';

        });

        backBtn.addEventListener('click', () => {
            checkoutView.style.display = 'none';
            mainView.style.display = 'block';
        });

        const decorateView = document.getElementById('decorate-view');
        const proceedBtn = document.getElementById('proceed-btn');
        const stickerTray=document.getElementById('sticker-tray');

        proceedBtn.addEventListener('click', () => {
            checkoutView.style.display = 'none';
            decorateView.style.display = 'block';

            stickerTray.innerHTML='';
            Array.from(cart.children).forEach(item=>{
                const clone=item.cloneNode(true);
                clone.draggable=true;
                stickerTray.appendChild(clone);
            });
        });

        const buildingCanvas=document.getElementById('building-canvas');
        let draggedFromTray=null;

        stickerTray.addEventListener('dragstart',(e)=>{
            if(e.target.classList.contains('sticker')) {
                draggedFromTray=e.target;
            }
        });

        buildingCanvas.addEventListener('dragstart',(e)=>{
            if(e.target.classList.contains('sticker')){
                draggedFromTray=e.target;
            }
        });

        buildingCanvas.addEventListener('dragover',(e)=>{
            e.preventDefault();
        });

        buildingCanvas.addEventListener('drop',(e)=> {
            e.preventDefault();
            if (draggedFromTray){
                const rect=buildingCanvas.getBoundingClientRect();
                const x=e.clientX-rect.left
                const y=e.clientY-rect.top;

                draggedFromTray.style.position='absolute';
                draggedFromTray.style.left=`${x-40}px`;
                draggedFromTray.style.top=`${y-40}px`;

                buildingCanvas.appendChild(draggedFromTray);
                draggedFromTray=null;
            }
        });

        const resetBtn=document.getElementById('reset-btn');

        resetBtn.addEventListener('click',()=>{
            Array.from(buildingCanvas.children).forEach(item=>{
                item.style.position='';
                item.style.left='';
                item.style.top='';
                stickerTray.appendChild(item);
            });
        });

        const backToShopBtn=document.getElementById('back-to-shop-btn');

        backToShopBtn.addEventListener('click',()=>{
            cart.innerHTML='';
            stickerTray.innerHTML='';
            buildingCanvas.innerHTML='';

            decorateView.style.display='none';
            mainView.style.display='block';
        });

        
    </script>


</body>
</html>
