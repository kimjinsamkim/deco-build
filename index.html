<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>decorate your building</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500&display=swap" rel="stylesheet">

    <style>
        html,body{
            margin:0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
        }

        h1 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 500;
            font-size: 30px;
        }
       .sticker {
            max-width: 100px;
            display: inline-block;
        }
        .sticker img {
            width: 100%;
            display: block;
            pointer-events: none;
        }

        #main-view{
            position:fixed;
            top:24px;
            left:24px;
            z-index:1;
        }
    
        #signage-grid {
            position:fixed;
            inset: 0;
            z-index:2;
            overflow-y:auto;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
            gap:16px;
            padding:100px 24px 24px;
            box-sizing: border-box;
        }
        #layer-controls{
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap:12px;
        }
        #cart {
            min-height: 100px;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px
        }
        #checkout-btn {
            margin-left: 16px;
        }
        #checkout-view {
            display: none;
        }
        #checkout-list {
            min-height: 100px;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 12px
        }
        .checkout-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        #checkout-footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #decorate-view {
            display: none;
        }
        #building-canvas {
            position: relative;
            width: 600px;
            height: 400px;
            background-image: url('images/building-1-neue-national.jpg');
            background-size: cover;
            background-position: center;
          
        }
        #sticker-tray {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding: 12px;
            border: 2px dashed #999;
            border-radius: 8px;
            min-height: 100px
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>


<body>
    <div id="main-view">
        <div id="layer-info">
            <h1>select signs</h1>
            <span id="cart-count">0</span>
            <div id="cart"></div>
        </div>

        <div id="signage-grid"></div>

        <div id="layer-controls">
            <button id="checkout-btn">check out</button></div>
        </div>
    </div>
   
       
    <div id="checkout-view">
        <h1>your cart</h1>
        <div id="checkout-list"></div>
        <div id="checkout-footer">
            <span id="item-count"></span>
            <button id="back-btn">back</button>
            <button id="proceed-btn">proceed</button>
        </div>
    </div>

    <div id = "decorate-view">
        <h1>decorate your building</h1>
        <div id="building-canvas"></div>
        <button id="reset-btn">reset</button>
        <button id="back-to-shop-btn">back to shop</button>
        <button id="save-btn">save as image</button>
        <div id="sticker-tray"></div>
    </div>

    <script>
        const signageFiles = [
        'sign-1-no-smoke.png',
        'sign-2-seven-eleven.png',
        'sign-3-please-slow-down.png',
        'sign-4-to-zionists.png',
          ];
    
        const signageGrid = document.getElementById('signage-grid');
        const cart = document.getElementById('cart');
        let draggedItem = null;

        signageFiles.forEach(filename => {
            const parts = filename.replace('.png', '').split('-');
            const desc = parts.slice(2).join(' ');

            const sticker = document.createElement('div');
            sticker.className = 'sticker';
            sticker.draggable = true;
            sticker.dataset.desc = desc;
            sticker.innerHTML = `<img src="images/${filename}" alt="${desc}">`;

            sticker.addEventListener('dragstart', (e) => {
                draggedItem = sticker;
            });

            signageGrid.appendChild(sticker);
        });

        cart.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        cart.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedItem) {
                cart.appendChild(draggedItem);
                draggedItem = null;
            }
        });

        const mainView = document.getElementById('main-view');
        const checkoutView = document.getElementById('checkout-view');
        const checkoutList = document.getElementById('checkout-list');
        const itemCount = document.getElementById('item-count');
        const checkoutBtn = document.getElementById('checkout-btn');
        const backBtn = document.getElementById('back-btn');

        checkoutBtn.addEventListener('click', () => {
            const cartItems = Array.from(cart.children);
            cartItems.sort((a,b) => a.dataset.desc.localeCompare(b.dataset.desc));

            checkoutList.innerHTML = '';
            cartItems.forEach(item => {
                const imgSrc = item.querySelector('img').src;
                const row = document.createElement('div');
                row.className = 'checkout-item';
                row.innerHTML = `
                    <div class="sticker"><img src="${imgSrc}" alt=""></div>
                    <span>${item.dataset.desc}</span>
                `;
                checkoutList.appendChild(row);
            });

            itemCount.textContent = `you selected ${cartItems.length} items`;

            mainView.style.display = 'none';
            checkoutView.style.display = 'block';

        });

        backBtn.addEventListener('click', () => {
            checkoutView.style.display = 'none';
            mainView.style.display = 'block';
        });

        const decorateView = document.getElementById('decorate-view');
        const proceedBtn = document.getElementById('proceed-btn');
        const stickerTray=document.getElementById('sticker-tray');

        proceedBtn.addEventListener('click', () => {
            checkoutView.style.display = 'none';
            decorateView.style.display = 'block';

            stickerTray.innerHTML='';
            Array.from(cart.children).forEach(item=>{
                const clone=item.cloneNode(true);
                clone.draggable=true;
                stickerTray.appendChild(clone);
            });
        });

        const buildingCanvas=document.getElementById('building-canvas');
        let draggedFromTray=null;

        stickerTray.addEventListener('dragstart',(e)=>{
            const target = e.target.closest('.sticker');
            if (target) {
                draggedFromTray = target;
            }
        });

        buildingCanvas.addEventListener('dragstart',(e)=>{
            const target = e.target.closest('.sticker');
            if (target) {
                draggedFromTray = target;
            }
        });

        buildingCanvas.addEventListener('dragover',(e)=>{
            e.preventDefault();
        });

        buildingCanvas.addEventListener('drop',(e)=> {
            e.preventDefault();
            if (draggedFromTray){
                const rect=buildingCanvas.getBoundingClientRect();
                const x=e.clientX-rect.left
                const y=e.clientY-rect.top;

                draggedFromTray.style.position='absolute';
                draggedFromTray.style.left=`${x-40}px`;
                draggedFromTray.style.top=`${y-40}px`;

                buildingCanvas.appendChild(draggedFromTray);
                draggedFromTray=null;
            }
        });

        const resetBtn=document.getElementById('reset-btn');

        resetBtn.addEventListener('click',()=>{
            Array.from(buildingCanvas.children).forEach(item=>{
                item.style.position='';
                item.style.left='';
                item.style.top='';
                stickerTray.appendChild(item);
            });
        });

        const backToShopBtn=document.getElementById('back-to-shop-btn');

        backToShopBtn.addEventListener('click',()=>{
            Array.from(cart.children).forEach(item=>{
                signageGrid.appendChild(item)
            })

            stickerTray.innerHTML='';
            buildingCanvas.innerHTML='';

            decorateView.style.display='none';
            mainView.style.display='block';
            
        });

        const saveBtn=document.getElementById('save-btn');

        saveBtn.addEventListener('click',()=>{
            html2canvas(buildingCanvas).then(canvas=>{
                const link=document.createElement('a');
                link.download='my-building.png';
                link.href=canvas.toDataURL('image/png');
                link.click();
            });
        });

        
    </script>


</body>
</html>
